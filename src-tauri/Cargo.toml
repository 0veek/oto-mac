[package]
name = "oto"
version = "0.1.0"
description = "System-wide AI voice dictation for macOS"
authors = ["you"]
edition = "2021"
license = "Apache-2.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "oto_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.19"
tokio = { version = "1.53.0", features = ["rt-multi-thread", "macros", "sync", "time"] }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "multipart", "rustls"] }
directories = "6.0.0"
dirs = "6.0.0"
keyring = "4.1.5"
cpal = "0.18.1"
hound = "3.5.1"
tauri-plugin-global-shortcut = "2.3.2"
async-trait = "0.1.91"
arboard = "3.6.1"
whisper-rs = "0.16.0"
core-foundation = "0.10"
core-graphics = { version = "0.24", features = ["elcapitan", "highsierra"] }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSRunningApplication", "NSWorkspace", "NSApplication"] }
objc2-foundation = { version = "0.3", features = ["NSString", "NSArray"] }

[dev-dependencies]
tempfile = "3.27.0"

# Production builds serve the embedded frontend (frontendDist).
# `tauri dev` disables this so the app loads the Vite dev server instead.
[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
